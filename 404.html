<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#F6F7FB">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Page Not Found · AB Integrity</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F6F7FB;--bg2:#FFFFFF;--bdr:#E2E7F0;
    --tx:#0A0D13;--tx2:#4A5361;--tx3:#646D7B;
    --ac:#0B5BFF;--r:#DC2626;
    --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100vh;background:var(--bg);color:var(--tx);font-family:var(--sans)}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center}
  .code{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--r);margin-bottom:20px}
  h1{font-size:clamp(32px,5vw,56px);font-weight:900;letter-spacing:-1px;margin-bottom:16px}
  p{font-size:15px;color:var(--tx2);line-height:1.7;max-width:440px;margin-bottom:32px}
  a.home{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ac);text-decoration:none;border:1px solid var(--bdr);padding:12px 24px;transition:border-color .15s}
  a.home:hover{border-color:var(--ac)}

  /* ── light theme chrome, shared with the homepage ── */
  body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  ::selection{background:#C9D2FF;color:#0A0D13}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2.5px solid #0B5BFF;outline-offset:3px}
  .nav{backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px)}
  .nav-inner{gap:24px}
  .brand-mark{width:33px;height:33px;border-radius:9px;
    box-shadow:0 4px 12px -4px rgba(11,91,255,.55);
    transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s cubic-bezier(.16,1,.3,1)}
  .brand:hover .brand-mark{transform:rotate(-5deg) scale(1.05);box-shadow:0 7px 16px -5px rgba(11,91,255,.6)}
  .brand-name{letter-spacing:-.03em}
  .nav-right{display:flex;align-items:center;gap:28px}
  .nav-cta{font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;text-decoration:none;
    background:#0B5BFF;color:#fff;padding:10px 18px;border-radius:999px;white-space:nowrap;
    transition:background .18s cubic-bezier(.16,1,.3,1),transform .18s cubic-bezier(.16,1,.3,1)}
  .nav-cta:hover{background:#0A3CC4;transform:translateY(-1px)}
  .nav-cta .cta-s{display:none}
  .nav-cta.active{background:#0B5BFF}
  @media(max-width:900px){.nav-right{gap:18px}}
  @media(max-width:660px){.nav-cta{padding:9px 15px;font-size:13.5px}}
  @media(max-width:430px){.nav-cta{padding:8px 12px;font-size:12.5px}.nav-cta .cta-l{display:none}.nav-cta .cta-s{display:inline}}

  /* ── no sideways pan on a phone ──
     The guard has to sit on html as well as body: body alone is the case iOS
     Safari ignores. min-width:0 lets grid and flex children actually shrink,
     so anything with its own overflow-x scrolls inside itself instead of
     widening the page. */
  html{overflow-x:hidden}
  body{overflow-x:hidden;width:100%;max-width:100%;position:relative}
  img,svg,video,canvas,iframe{max-width:100%;height:auto}
  table{max-width:100%}
  pre{max-width:100%;overflow-x:auto}
  /* grid and flex items default to min-width:auto, which sizes a column to its
     widest unbreakable content and pushes the page wider than the screen.
     Zero specificity, so any explicit rule still wins. */
  *{min-width:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">error 404 — not found</div>
  <h1>This page doesn't exist.</h1>
  <p>Like an underpowered test result, this URL looked promising but didn't hold up. The tools are all on the home page.</p>
  <a class="home" href="/">← Back to the stack</a>
</div>
</body>
</html>
